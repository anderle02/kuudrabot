name: Deploy Worker

# Only runs post-merge on main. Must be approved by maintainers (see CODEOWNERS).
on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/shared/**"
      - "docker/docker-compose.prod.yml"

concurrency:
  group: deploy-worker
  cancel-in-progress: false # never cancel an in-flight production rollout

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          target: production
          push: true
          tags: |
            ${{ vars.REGISTRY }}/kuudrabot-worker:${{ steps.meta.outputs.tag }}
            ${{ vars.REGISTRY }}/kuudrabot-worker:latest

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=apps/worker
      # Additive-only migrations by convention, enforced in code review.
      - run: npx prisma migrate deploy --schema=apps/worker/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Rolling zero-downtime update of worker only
        env:
          WORKER_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ vars.REGISTRY }}
          DOCKER_HOST: ${{ secrets.PROD_DOCKER_HOST }}
        run: |
          docker --context production stack deploy \
            -c docker/docker-compose.yml \
            -c docker/docker-compose.prod.yml \
            kuudrabot

      - name: Wait for rollout to converge
        env:
          DOCKER_HOST: ${{ secrets.PROD_DOCKER_HOST }}
        run: |
          docker --context production service update --detach=false kuudrabot_worker

      - name: Rollback on failure
        if: failure()
        env:
          DOCKER_HOST: ${{ secrets.PROD_DOCKER_HOST }}
        run: docker --context production service rollback kuudrabot_worker
