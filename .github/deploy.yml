name: Deploy Worker

# Only runs post-merge on main. Must be approved by maintainers (see CODEOWNERS).
on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/shared/**"
      - "docker/docker-compose.prod.yml"

concurrency:
  group: deploy-worker
  cancel-in-progress: false # never cancel an in-flight production rollout

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          target: production
          push: true
          tags: |
            ${{ vars.REGISTRY }}/kuudrabot-worker:${{ steps.meta.outputs.tag }}
            ${{ vars.REGISTRY }}/kuudrabot-worker:latest

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH and Docker context
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          docker context create production --docker "host=ssh://deploy@$SSH_HOST" || true
          docker context use production

      - name: Run migrations inside the stack's network
        env:
          WORKER_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ vars.REGISTRY }}
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          POSTGRES_DB: kuudrabot
        run: |
          docker run --rm --network kuudrabot_default \
            -e DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
            ${REGISTRY}/kuudrabot-worker:${WORKER_IMAGE_TAG} \
            npx prisma migrate deploy --schema=apps/worker/prisma/schema.prisma

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH and Docker context
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          docker context create production --docker "host=ssh://deploy@$SSH_HOST" || true
          docker context use production

      - name: Rolling zero-downtime update of worker only
        env:
          WORKER_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GATEWAY_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ vars.REGISTRY }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
          LOG_LEVEL: info
        run: |
          docker stack deploy \
            -c docker/docker-compose.yml \
            -c docker/docker-compose.prod.yml \
            kuudrabot

      - name: Wait for rollout to converge
        run: docker service update --detach=false kuudrabot_worker

      - name: Rollback on failure
        if: failure()
        run: docker service rollback kuudrabot_worker
