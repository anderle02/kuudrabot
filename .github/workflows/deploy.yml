name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/shared/**"

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          target: production
          push: true
          tags: |
            ${{ vars.REGISTRY }}/kuudrabot-worker:${{ github.sha }}
            ${{ vars.REGISTRY }}/kuudrabot-worker:latest

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH and Docker context
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          docker context create production --docker "host=ssh://deploy@$SSH_HOST" || true
          docker context use production

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run database migrations
        env:
          WORKER_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ vars.REGISTRY }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          docker run --rm --network kuudrabot_default \
            -e DATABASE_URL="postgresql://bot:${POSTGRES_PASSWORD}@postgres:5432/kuudrabot" \
            ${REGISTRY}/kuudrabot-worker:${WORKER_IMAGE_TAG} \
            npx prisma migrate deploy --schema=apps/worker/prisma/schema.prisma

  deploy:
    needs:
      - build-and-push
      - migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH and Docker context
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          docker context create production --docker "host=ssh://deploy@$SSH_HOST" || true
          docker context use production

      - name: Deploy worker (zero downtime)
        env:
          WORKER_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          IMAGE="${REGISTRY}/kuudrabot-worker:${WORKER_IMAGE_TAG}"
          echo "Deploying image: $IMAGE"
          docker service update \
            --image "$IMAGE" \
            --with-registry-auth \
            --detach=false \
            kuudrabot_worker

      - name: Verify deployed image matches intended tag
        env:
          WORKER_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          ACTUAL=$(docker service inspect kuudrabot_worker --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          EXPECTED="${REGISTRY}/kuudrabot-worker:${WORKER_IMAGE_TAG}"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED"* ]]; then
            echo "Deployment failed, service rolled back to previous image"
            exit 1
          fi
