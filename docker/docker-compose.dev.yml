services:
  redis:
    ports:
      - "6379:6379"

  postgres:
    ports:
      - "5432:5432"

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
      target: development
    command: npm run dev --workspace=apps/gateway
    volumes:
      - ../apps/gateway:/app/apps/gateway
      - ../packages/shared:/app/packages/shared
      - /app/node_modules

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      target: development
    command: npm run dev --workspace=apps/worker
    volumes:
      - ../apps/worker:/app/apps/worker
      - ../packages/shared:/app/packages/shared
      - /app/node_modules

networks:
  default:
    driver: bridge
