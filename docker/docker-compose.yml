services:
  redis:
    image: redis:7-alpine
    deploy:
      restart_policy:
        condition: any
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    deploy:
      restart_policy:
        condition: any
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: kuudrabot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d kuudrabot"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    deploy:
      restart_policy:
        condition: any
        delay: 5s
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTHCHECK_PORT: 8080
      NODE_ENV: production
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      HYPIXEL_API_KEY: ${HYPIXEL_API_KEY}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://bot:${POSTGRES_PASSWORD:-bot}@postgres:5432/kuudrabot
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTHCHECK_PORT: 8080
      NODE_ENV: production
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  postgres-data:

networks:
  default:
    driver: overlay
    attachable: true
